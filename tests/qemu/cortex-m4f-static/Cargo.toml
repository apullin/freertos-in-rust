[package]
name = "freertos-qemu-cortex-m4f-static"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
static-only = []

[[bin]]
name = "static-only"
path = "src/main.rs"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
freertos-in-rust = { path = "../../..", default-features = false, features = [
    "port-cortex-m4f",
    "timers",
    "task-priority-set",
] }
freertos-qemu-test-common = { path = "../common" }
panic-semihosting = { version = "0.6", features = ["exit"] }

[profile.release]
opt-level = "s"
debug = true
lto = true
