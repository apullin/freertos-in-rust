[package]
name = "freertos-qemu-cortex-m4f"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "kernel-core"
path = "src/bin/kernel_core.rs"

[[bin]]
name = "isr"
path = "src/bin/isr.rs"

[[bin]]
name = "allocator"
path = "src/bin/allocator.rs"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
freertos-in-rust = { path = "../../..", default-features = false, features = [
    "port-cortex-m4f",
    "heap-4",
    "stream-buffers",
    "timers",
    "pend-function-call",
    "use-mutexes",
    "task-priority-set",
] }
freertos-qemu-test-common = { path = "../common" }
panic-semihosting = { version = "0.6", features = ["exit"] }

[profile.dev]
opt-level = "s"
debug = true

[profile.release]
opt-level = "s"
debug = true
lto = true
